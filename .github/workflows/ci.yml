name: Backend CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.10'
  UV_VERSION: '0.10.12'
  DJANGO_SETTINGS_MODULE: settings.test
  SECRET_KEY: github-actions-only-secret-key
  DEBUG: 'True'
  ALLOWED_HOSTS: localhost,127.0.0.1,testserver
  DB_NAME: nwuicu_test
  DB_USER: postgres
  DB_PASSWORD: postgres
  DB_HOST: 127.0.0.1
  DB_PORT: '5432'
  UNIVERSITY_MAIL_SUFFIX: nwu.edu.cn
  UNIVERSITY_TEACHER_MAIL_SUFFIX: nwu.edu.cn
  UNIVERSITY_STUDENT_MAIL_SUFFIX: stumail.nwu.edu.cn
  UNIVERSITY_CHINESE_NAME: 西北大学
  UNIVERSITY_ENGLISH_NAME: Northwest University
  UNIVERSITY_ENGLISH_ABBREVIATION_NAME: NWU
  DEFAULT_SUPER_USER_ID: '2147483000'
  DEFAULT_SUPER_USER_USERNAME: ci_admin
  DEFAULT_SUPER_USER_PASSWORD: ci-only-password
  DEFAULT_SUPER_USER_EMAIL: ci-admin@example.com
  DEFAULT_USER_AVATAR_FILE_NAME: default_avatar.jpg
  DEFAULT_USER_AVATAR_UUID: c3fd49e2-87ce-4980-9719-ac745774b6d3
  ANONYMOUS_USER_AVATAR_FILE_NAME: anonymous_avatar.jpg
  ANONYMOUS_USER_AVATAR_UUID: c3fd49e2-87ce-4980-9719-ac745774b6d2
  RESOURCES_WEBSITE_URL: https://resources.example.com

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --frozen --all-groups
      - name: Run all pre-commit checks
        run: uv run --frozen pre-commit run --all-files --show-diff-on-failure

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: nwuicu_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nwuicu_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --frozen --all-groups
      - name: Run Django system checks
        run: uv run --frozen python manage.py check
      - name: Check for missing migrations
        run: uv run --frozen python manage.py makemigrations --check --dry-run
      - name: Run all tests
        run: uv run --frozen pytest
