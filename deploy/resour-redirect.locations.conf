# Include in the legacy HTTP and HTTPS server blocks AFTER deploying the backend
# compatibility endpoints and new gateway. Replace ALL old AList proxy and college
# rewrite locations, including ^~ /. Remove HTTP -> old HTTPS server-level rules.
# Keep TLS, ACME and search ownership verification locations. A server-level return
# must not intercept certificate renewal.

location = /robots.txt {
    default_type text/plain;
    return 200 "User-agent: *\nAllow: /\nSitemap: https://nwu.icu/sitemap.xml\n";
}

location = /sitemap.xml {
    return 301 https://nwu.icu/sitemap.xml;
}

location / {
    # Preserve the encoded URI while the backend maps aliases and mount prefixes.
    # No client-visible intermediate redirect, and no original URI suffix added.
    rewrite ^ /api/resources/legacy-redirect/ break;
    proxy_pass http://127.0.0.1:18080;
    proxy_set_header Host nwu.icu;
    proxy_set_header X-Legacy-URI $request_uri;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_cache off;
    proxy_redirect off;
    proxy_intercept_errors off;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
}
